[[capture.canon]]
kind = "technique"
oneliner = "In Slidev custom Vue components, use `useSlideContext()` -> `$clicks` for reactive click state, NOT `useNav()` (which exposes navigation methods only)."
details = """`useNav()` returns `{ currentPage, total, isPresenter, next(), prev(), nextSlide(), go(), ... }` - no `clicks`. Click state lives in `useSlideContext()`:
```js
import { useSlideContext } from '@slidev/client'
const { $clicks, $page, $frontmatter } = useSlideContext()
```
`$clicks` is a reactive ref auto-unwrapped in templates. Use as `:class="{ active: $clicks >= N }"` for cumulative state, or `$clicks === N` for current-only state. Documented in `IB/skills/slidev/references/core-global-context.md` lines ~52 and ~105-109. This was the root cause of "animation doesn't work" early in this round - silently no-op'd because `clicks` was undefined.
"""

